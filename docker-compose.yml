services:

  # ── Vector database ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6335:6333"   # host 6335 → container 6333 (avoids clash with local Qdrant)
      - "6336:6334"   # gRPC port (optional)
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ── FastAPI backend ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"   # http://localhost:8001
    env_file:
      - .env          # loads OPENAI_API_KEY, GCP_PROJECT_ID, GCS_BUCKET_DOCS, etc.
    environment:
      # Override .env values for the internal Docker network
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""   # local Qdrant has no auth; cloud key from .env is not needed here
      COLLECTION_NAME: ${COLLECTION_NAME:-docs-index}
    volumes:
      - ./data:/app/data:ro          # mount local docs for CLI indexing
      - hf_cache:/root/.cache        # cache HuggingFace models between restarts
    depends_on:
      qdrant:
        condition: service_healthy

  # ── Streamlit web UI ─────────────────────────────────────────────────────
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      streamlit run ui/streamlit_app.py
        --server.address 0.0.0.0
        --server.port 8501
        --server.headless true
    ports:
      - "8501:8501"   # http://localhost:8501
    env_file:
      - .env
    environment:
      # Streamlit runs server-side inside Docker; reach the API via internal network
      DOCUMIND_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  qdrant_storage:   # persistent Qdrant index (survives container restarts)
  hf_cache:         # cached HuggingFace cross-encoder model
